name: Documentation site

# Builds the VitePress site on every change to the docs (a dead link fails
# the build) and publishes it to GitHub Pages from main. Enable Pages with
# "GitHub Actions" as the source in the repository settings.
on:
  push:
    branches: [main]
    paths: ['docs/**', 'package.json', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'package.json', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
