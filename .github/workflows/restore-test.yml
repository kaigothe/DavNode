name: Backup restore test

# Proves the backup procedure in docs/operations/backup.md: seed an instance,
# pg_dump it, destroy it, pg_restore into a new database, and check the data
# and the quota counters. Infrastructure verification, not application code.
on:
  schedule:
    # Mondays, 04:17 UTC.
    - cron: '17 4 * * 1'
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspaces

      - name: Backup, destroy, restore, verify
        run: scripts/restore-test/run.sh

      # The verification itself has to be able to fail: restoring a backup
      # taken before the event was written must be reported as a failure.
      - name: A stale backup must be detected
        run: |
          if RESTORE_TEST_STALE=1 scripts/restore-test/run.sh; then
            echo "::error::the restore test accepted a stale backup"
            exit 1
          fi
          echo "the stale backup was rejected, as intended"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-test-logs
          path: .restore-test/*.log
          if-no-files-found: ignore
