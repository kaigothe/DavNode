name: CI

on:
  push:
  pull_request:

jobs:
  # Developer Certificate of Origin: every non-merge, non-bot commit of a
  # pull request needs a Signed-off-by trailer (see CONTRIBUTING.md). The
  # history up to the baseline below was written before the check was
  # enforced and is exempt; everything after it must be signed off.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Signed-off-by trailers
        run: |
          missing=0
          baseline=939b65f075810f60f8f86ec98d5037c7ba96cd3e
          for sha in $(git rev-list --no-merges "origin/${{ github.base_ref }}..HEAD" "^$baseline"); do
            author=$(git log -1 --format=%ae "$sha")
            case "$author" in *'[bot]'*) continue ;; esac
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+>'; then
              echo "::error::Commit $sha has no Signed-off-by line (use git commit -s)"
              missing=1
            fi
          done
          exit $missing

  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build --workspaces
      # The admin UI's API types are generated from the OpenAPI document and
      # checked in; a change to the spec without regenerating them fails here.
      - name: Admin UI API types are up to date
        run: |
          npm run generate:api -w @davnode/admin-ui
          git diff --exit-code packages/admin-ui/src/api/schema.d.ts
      # The admin UI must stay within its download budget (gzip).
      - name: Admin UI stays within its bundle budget
        run: npm run check:budget -w @davnode/admin-ui

  test:
    needs: lint-and-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres, mysql]
    # Postgres and MySQL always start as service containers regardless of
    # which matrix leg is running (GitHub Actions doesn't support
    # conditionally skipping a service based on the matrix value) — the
    # sqlite leg just never talks to them.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: davnode
          POSTGRES_USER: davnode
          POSTGRES_PASSWORD: davnode
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U davnode"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:9
        env:
          MYSQL_DATABASE: davnode
          MYSQL_USER: davnode
          MYSQL_PASSWORD: davnode
          MYSQL_ROOT_PASSWORD: davnode
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    # No DAVNODE_DB_* env here (deliberately, not an oversight): every test
    # in the suite builds its own SQLite DataSource directly (e.g.
    # `createDataSource({}, { entities: ALL_ENTITIES, migrations:
    # ALL_SQLITE_MIGRATIONS })`), regardless of which matrix leg is
    # running, so `npm test --workspaces` doesn't read these at all today.
    # Setting DAVNODE_DB_TYPE per leg here previously did real harm even
    # though nothing consumed it for a connection: a couple of entities
    # (file-content.entity.ts's blob column type,
    # collection.entity.ts's conditional partial-unique-index decorator)
    # read process.env.DAVNODE_DB_TYPE directly at module-load time to
    # pick driver-specific schema shape, so the postgres/mysql legs built
    # Postgres/MySQL-shaped entity metadata against an actual SQLite
    # connection, which SQLite's driver rejects outright.
    #
    # The matrix and the Postgres/MySQL service containers stay in place
    # as scaffolding for the tracked follow-up (making the suite actually
    # connect to each leg's real engine, per planning/02-roadmap.md's M0
    # "Testmatrix Postgres/SQLite/MySQL") — that work should also revisit
    # the two entities above, since they'd need to stop trusting ambient
    # env once tests genuinely vary DAVNODE_DB_TYPE per run.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspaces
      - run: npm test --workspaces

  # The admin UI in a real browser against a real server (M14): the
  # management and calendar/contact flows, axe accessibility checks with
  # colour contrast in both themes, the keyboard and the XSS case.
  admin-ui-e2e:
    needs: lint-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspaces
      - run: npx playwright install --with-deps chromium
        working-directory: packages/admin-ui
      - run: npm run test:e2e -w @davnode/admin-ui
      - name: Upload the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-ui-e2e-traces
          path: packages/admin-ui/test-results
          if-no-files-found: ignore

  # WebDAV conformance (M11, milestones/M11-client-compatibility/
  # 06-conformance-suite-ci): the litmus suites run against a real server
  # started from the build. The result is evaluated differentially by
  # scripts/conformance/evaluate-litmus.mjs — any failure not listed in
  # scripts/conformance/litmus-expected-failures.txt fails the job.
  litmus:
    needs: lint-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspaces
      - run: sudo apt-get update && sudo apt-get install -y litmus
      - run: scripts/conformance/start-server.sh
      - run: scripts/conformance/run-litmus.sh
      - name: Stop the server
        if: always()
        run: scripts/conformance/stop-server.sh
      - name: Upload the litmus log and the server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: litmus-results
          path: |
            .conformance/litmus.log
            .conformance/server.log
          if-no-files-found: warn

  # CalDAV/CardDAV conformance (M11, milestones/M11-client-compatibility/
  # 06-conformance-suite-ci): Apple's CalDAVTester/CardDAVTester (Python 2,
  # so run in a container) against a server started per test file. DavNode
  # does not pass all of it, so the gate is a baseline of individually
  # passing tests (scripts/conformance/caldavtester-baseline.txt); see
  # docs/conformance.md.
  caldavtester:
    needs: lint-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspaces
      - run: scripts/conformance/run-caldavtester.sh
      - name: Stop the server
        if: always()
        run: scripts/conformance/stop-server.sh
      - name: Upload the CalDAVTester logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caldavtester-results
          path: |
            .conformance/caldavtester-logs
            .conformance/server.log
          if-no-files-found: warn

  # Data written by the previous release must survive the migrations of this
  # commit (M13, scripts/upgrade-test/run.sh).
  upgrade-test:
    needs: lint-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspaces
      - run: scripts/upgrade-test/run.sh

  # The container image must build, become healthy and serve a file round
  # trip (M13, 03-distribution/01-docker-image-release).
  docker-smoke:
    needs: lint-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t davnode:ci .
      - name: Start, bootstrap and talk to the container
        run: |
          docker run -d --name davnode -p 8080:8080 davnode:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz && break
            sleep 2
          done
          docker exec davnode node packages/core/dist/cli/bootstrap.js \
            --tenant-slug=ci --tenant-name=CI --username=admin \
            --email=admin@example.com --password=ci-password-123
          curl -fsS -u admin:ci-password-123 -X PUT -d hello http://127.0.0.1:8080/dav/ci/files/hello.txt
          test "$(curl -fsS -u admin:ci-password-123 http://127.0.0.1:8080/dav/ci/files/hello.txt)" = hello
      # The admin UI (M14) is shipped in the image but off by default.
      - name: Admin UI is off by default and served when enabled
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/admin-ui/)" = 404
          docker run -d --name davnode-ui -p 8081:8080 -e DAVNODE_ADMIN_UI_ENABLED=true davnode:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8081/healthz && break
            sleep 2
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/admin-ui/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/admin-ui/users)" = 200
          curl -fsS http://127.0.0.1:8081/admin-ui/ | grep -q 'DavNode Admin'
      - name: Container log on failure
        if: failure()
        run: |
          docker logs davnode
          docker logs davnode-ui || true

  release:
    needs:
      [
        lint-and-build,
        test,
        admin-ui-e2e,
        litmus,
        caldavtester,
        docker-smoke,
        upgrade-test,
      ]
    # Only push events to main create releases — pull_request runs (and
    # pushes to any other branch) skip this job. .releaserc.json's own
    # `branches: ["main"]` would refuse a release anyway, but gating here
    # avoids even attempting the checkout/install for runs that could
    # never release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release needs the full commit history (and tags) to
          # determine the next version, not just the latest commit.
          fetch-depth: 0
          # main is protected: the release commit (version, changelog) is
          # pushed with the maintainer's token, which may bypass the rules,
          # not with the job's GITHUB_TOKEN, which may not.
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remember the latest tag
        id: before
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      # The image job below is chained to this one instead of to the tag, so
      # a release that is created with a personal token cannot publish twice.
      - name: Detect a new release
        id: version
        run: |
          git fetch --tags --force
          after=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$after" ] && [ "$after" != "${{ steps.before.outputs.tag }}" ]; then
            echo "tag=$after" >> "$GITHUB_OUTPUT"
          fi
    outputs:
      tag: ${{ steps.version.outputs.tag }}

  # Container image and deployment bundle for a new release (M13,
  # milestones/M13-open-source-launch/03-distribution). The `container-release`
  # environment lets the maintainer require a manual approval for publishing.
  publish-image:
    needs: release
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/release-image.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
