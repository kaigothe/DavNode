version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci(deps)'
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deps)'
    # The base image follows a Node LTS line on purpose (see the Dockerfile
    # and the Node version in ci.yml); a new major is switched by hand, not
    # proposed as the newest odd, short-lived release.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
