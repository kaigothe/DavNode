name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem first; a solution is optional.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea or standard (RFC) involved
