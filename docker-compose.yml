# Postgres and MySQL services for the DB-engine test matrix (see
# milestones/M0-fundament/03-typeorm-database-setup/03-db-engine-test-matrix.md).
# The `app` service, named volumes for production use, and an `.env.example`
# are added on top of this in milestones/M0-fundament/04-docker-setup — this
# file is extended there, not duplicated.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: davnode
      POSTGRES_USER: davnode
      POSTGRES_PASSWORD: davnode
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U davnode']
      interval: 5s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:9
    environment:
      MYSQL_DATABASE: davnode
      MYSQL_USER: davnode
      MYSQL_PASSWORD: davnode
      MYSQL_ROOT_PASSWORD: davnode
    ports:
      - '3306:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 5
